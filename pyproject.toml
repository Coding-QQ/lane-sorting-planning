[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-sorting-planning"
version = "0.1.0"
description = "MIQP and heuristic multi-stage trajectory planning for lane sorting in mixed-autonomy traffic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gurobipy>=10.0",
    "matplotlib>=3.7",
]

[project.scripts]
lane-sorting-case-study = "lane_sorting_planning.case_study:main"

[tool.setuptools.packages.find]
include = ["lane_sorting_planning*"]
